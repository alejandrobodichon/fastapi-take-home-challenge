version: 2.1
orbs:
  python: circleci/python@4.0.0

jobs:
  build_and_test: # this can be any name you choose
    executor: python/default # use the default executor defined within the orb
    docker:
      - image: cimg/python:3.14
      - image: postgres:17-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_thc
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost/test_thc
      POKEMON_API_URL: https://pokeapi.co/api/v2
    steps:
      - checkout # checkout source code
      - python/install-packages:
          pkg-manager: uv
      - run:
          name: Wait for Postgres
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Run tests
          command: uv run pytest --cov=. --cov-report=term-missing
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

workflows:
  build_test_deploy: # this can be any name you choose
    jobs:
      - build_and_test